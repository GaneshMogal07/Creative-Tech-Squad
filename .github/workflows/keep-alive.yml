name: Keep Render Service Awake

on:
  schedule:
    # Runs every 5 minutes automatically via GitHub Actions
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Creative Tech Squad Production URL
        run: |
          echo "Sending keep-alive ping to https://creativetechsquad.in/health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -m 30 https://creativetechsquad.in/health || true)
          echo "Response code: $response"
