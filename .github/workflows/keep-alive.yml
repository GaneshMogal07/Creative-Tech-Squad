name: Keep Render Service Awake 24x7

on:
  schedule:
    # Trigger every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  keep_alive:
    name: Ping Health Endpoint Every 2 Mins
    runs-on: ubuntu-latest
    steps:
      - name: Send Continuous Pings to Keep Server Awake
        run: |
          for i in {1..3}; do
            echo "Ping $i: Sending keep-alive request to https://creativetechsquad.in/health..."
            curl -s -f -m 30 https://creativetechsquad.in/health || true
            if [ $i -lt 3 ]; then
              echo "Waiting 90 seconds before next ping..."
              sleep 90
            fi
          done
          echo "Keep-alive pulse finished successfully."
